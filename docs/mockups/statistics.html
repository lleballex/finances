const chart=(lines)=>`<svg viewBox="0 0 600 200" role="img" aria-label="Пример динамики по месяцам"><path class="grid-line" d="M35 20H580 M35 70H580 M35 120H580 M35 170H580"/><text x="10" y="174">0</text>${lines.map((p,i)=>`<polyline class="line ${['line-green','line-orange','line-purple'][i]}" points="${p}"/>`).join('')}<text x="35" y="195">апр</text><text x="190" y="195">июн</text><text x="345" y="195">авг</text><text x="540" y="195">ноя</text></svg>`;
const data=[{title:'Расходы',total:'647 600 ₽',names:['Продукты','Кофе и кафе','Дом'],values:['42%','30%','28%']},{title:'Доходы',total:'960 000 ₽',names:['Зарплата','Другие доходы','Дополнительно'],values:['42%','30%','28%']}];const lines=['35,150 112,130 190,139 268,105 345,115 423,80 501,94 580,60','35,160 112,153 190,143 268,152 345,130 423,138 501,118 580,125','35,166 112,157 190,160 268,146 345,150 423,138 501,141 580,134'];
document.querySelector('#analyses').innerHTML=data.map((d,k)=>`<section><h2 class="block-title">${d.title}</h2><div class="chart-panel"><div class="panel-head"><h3>Динамика ${k?'доходов':'расходов'}</h3><p>${d.total} за весь период</p></div>${chart([lines[0]])}</div><div class="analysis-grid"><div class="chart-panel"><div class="panel-head"><h3>Динамика по категориям</h3><div class="selection-actions" aria-label="Выбор категорий"><button class="legend-actions" type="button" data-all="${k}" disabled>Выбрать все</button><button class="legend-actions" type="button" data-clear="${k}">Снять выбор</button></div></div><div class="legend-list">${d.names.map((n,i)=>`<button type="button" data-series="${i}" aria-pressed="true"><span class="legend-dot" style="background:${['#15915e','#d49e5f','#9d85ba'][i]}"></span>${n}</button>`).join('')}</div>${chart(lines)}</div><div class="chart-panel"><div class="panel-head"><h3>Распределение</h3><p>За весь период</p></div><div class="donut-layout"><div class="donut" role="img" aria-label="Распределение по категориям: ${d.names.map((n,i)=>n+' '+d.values[i]).join(', ')}"></div><div class="distribution">${d.names.map((n,i)=>`<div><span><i class="legend-dot" style="background:${['#15915e','#d49e5f','#9d85ba'][i]}"></i>${n}</span><strong>${d.values[i]}</strong></div>`).join('')}</div></div></div></div></section>`).join('');
document.addEventListener('click',e=>{const button=e.target.closest('[data-series]'),all=e.target.closest('[data-all]'),clear=e.target.closest('[data-clear]');const panel=(button||all||clear)?.closest('.chart-panel');if(!panel)return;const buttons=[...panel.querySelectorAll('[data-series]')];if(button)button.setAttribute('aria-pressed',button.getAttribute('aria-pressed')==='true'?'false':'true');if(all||clear)buttons.forEach(b=>b.setAttribute('aria-pressed',all?'true':'false'));panel.querySelectorAll('polyline').forEach((line,i)=>line.style.display=buttons[i]?.getAttribute('aria-pressed')==='true'?'':'none');panel.querySelector('[data-all]').disabled=buttons.every(b=>b.getAttribute('aria-pressed')==='true');panel.querySelector('[data-clear]').disabled=buttons.every(b=>b.getAttribute('aria-pressed')==='false')});document.querySelector('#mode').addEventListener('change',e=>{const day=document.querySelector('#interval option[value=day]');day.disabled=e.target.selectedIndex===1;if(day.disabled&&day.selected)document.querySelector('#interval').value='month'});
</script></body></html>
