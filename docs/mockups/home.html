<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Могну Финансы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{font-family:Manrope,Arial,sans-serif;color:#111215;background:#bdbdbd}
.page{position:relative;isolation:isolate;width:100%;height:100dvh;overflow:hidden;background:#e8e9e7}
.page:before{content:"";position:absolute;inset:0 0 44%;background:#fafafa;border-radius:0 0 32px 32px;z-index:-1}
.brand{position:absolute;top:7%;left:4.5%;right:4.5%;text-align:center}
.brand h1{margin:0;font-size:min(24vw,32vh);font-weight:800;letter-spacing:-.085em;line-height:1;text-transform:uppercase;white-space:nowrap}
.brand p{margin:0;font-size:clamp(13px,1.6vw,22px);font-weight:800;letter-spacing:.32em;text-transform:uppercase}
.sculpture{position:absolute;z-index:1;left:50%;top:36%;width:min(68vw,1000px);height:59%;object-fit:contain;transform:translateX(-50%);animation:float 9s ease-in-out infinite;pointer-events:none}
.intro{position:absolute;z-index:2;left:5%;bottom:7%;width:210px;margin:0;font-size:clamp(15px,1.35vw,20px);font-weight:600;line-height:1.18;letter-spacing:-.035em}
.intro:after{content:"";display:block;width:150px;margin-top:13px;border-bottom:2px dotted #292929}
.login{position:absolute;z-index:2;right:5%;bottom:7%;display:flex;align-items:center;gap:11px;padding:9px 20px 9px 9px;border:0;border-radius:99px;background:#171717;color:#fff;font:700 14px Manrope,Arial,sans-serif;cursor:pointer;box-shadow:0 8px 22px #0002}
.login:hover{background:#333}.login:focus-visible{outline:3px solid #171717;outline-offset:4px}
.ya{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#fc3f1d;color:#fff;font:700 23px Arial,sans-serif}.arrow{margin-left:8px;font-size:19px}
@keyframes float{50%{transform:translate(-50%,-10px) rotate(2deg)}}
@media(max-width:700px){.page:before{bottom:48%;border-radius:0 0 24px 24px}.brand{top:12%;left:4%;right:4%}.brand h1{font-size:min(23vw,20vh)}.brand p{font-size:12px;letter-spacing:.27em;margin-top:5px}.sculpture{top:32%;width:115%;height:42%}.intro{left:7%;bottom:23%;width:175px;font-size:15px}.intro:after{width:120px;margin-top:9px}.login{left:7%;right:7%;bottom:8%;justify-content:center}}
@media(max-height:550px) and (min-width:701px){.brand{top:3%}.brand h1{font-size:min(22vw,29vh)}.brand p{font-size:13px}.sculpture{top:30%;height:65%}.intro,.login{bottom:5%}}
@media(prefers-reduced-motion:reduce){.sculpture{animation:none}}
</style>
</head>
<body>
<main class="page">
  <div class="brand"><h1>Могну</h1><p>финансы</p></div>
  <img class="sculpture" src="finance-sculpture-v2.png" alt="">
  <p class="intro">Ваши финансы.<br>Понятная картина.</p>
  <button class="login" type="button" aria-label="Войти через Яндекс ID — демонстрация"><span class="ya" aria-hidden="true">Я</span>Войти через Яндекс ID<span class="arrow" aria-hidden="true">↗</span></button>
</main>
</body>
</html>
