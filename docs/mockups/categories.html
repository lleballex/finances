<style>

6d72;background:#fafaf8;border-radius:28px}.mobile-nav{display:none}dialog{border:0;border-radius:32px;padding:0;width:min(510px,calc(100% - 32px));max-height:calc(100vh - 32px);background:#fafaf8;color:#171717;box-shadow:0 20px 70px #0003}dialog::backdrop{background:#17171788;backdrop-filter:blur(3px)}.dialog-inner{padding:28px}.dialog-header{display:flex;justify-content:space-between;align-items:start;gap:12px}.dialog-header h2{font-size:22px;margin:0;font-weight:900;-webkit-text-stroke:.35px currentColor}.close{border:0;border-radius:50%;background:#eeefeb;width:36px;height:36px;font-size:23px;line-height:1}.form{display:grid;gap:18px;margin-top:24px}.field{display:grid;gap:8px;font-size:13px;font-weight:700}.field input,.field select{height:46px;width:100%;border:1px solid transparent;border-radius:14px;background:#eeefeb;padding:0 13px;color:#202020}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.checkbox{display:flex;align-items:center;gap:10px;font-weight:700;font-size:13px}.checkbox input{width:18px;height:18px;accent-color:#202020}.choices{display:flex;flex-wrap:wrap;gap:8px}.choice{width:40px;height:40px;border:2px solid transparent;border-radius:13px;background:#eeefeb;font-size:21px}.choice.selected{border-color:#202020}.color-choice{width:36px;height:36px;border:3px solid #fafaf8;border-radius:50%;box-shadow:0 0 0 1px #d9ddd5}.color-choice.selected{box-shadow:0 0 0 2px #202020}.error{color:#ad3434;font-size:13px;margin:0;line-height:1.5}.form-footer{display:flex;justify-content:flex-end;gap:10px}.secondary{border:0;border-radius:99px;background:#eeefeb;padding:13px 18px;font-weight:700}.form-footer .primary{padding:13px 20px}.confirm-text{line-height:1.6;color:#555c54}.confirm-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.danger{background:#b73f3f}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.app{display:block;padding:16px}.sidebar{display:none}.mobile-nav{display:flex;gap:8px;overflow:auto;margin-bottom:25px}.mobile-nav a{white-space:nowrap;text-decoration:none;color:#343833;background:#ffffffbb;padding:10px 14px;border-radius:99px;font-size:12px;font-weight:700}.mobile-nav a.active{background:#202020;color:#fff}.main{padding:0}.header{margin-bottom:28px;align-items:flex-start}h1{font-size:28px}.primary{font-size:12px;padding:13px 15px}.grid{grid-template-columns:1fr;gap:14px}.section h2{font-size:23px}.section{margin-bottom:32px}.category{border-radius:27px}.form-row{grid-template-columns:1fr}}@media(max-width:400px){.header{flex-direction:column}.dialog-inner{padding:22px}}
/* Эксперимент с оболочкой по референсу только для страницы категорий. */
body:before{display:block;position:fixed;inset:0;width:min(1300px,calc(100% - 32px));height:100vh;margin:0 auto;background:rgba(250,250,248,.10);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.3);border-radius:56px;box-sizing:border-box}
.app{max-width:1300px;height:100vh;min-height:0;margin:0 auto;background:transparent;overflow-y:auto;overflow-x:hidden;border-radius:56px;scrollbar-width:thin}
.sidebar{position:fixed;left:max(32px,calc((100vw - 1300px)/2 + 16px));top:16px;width:240px;height:calc(100vh - 32px);z-index:1}
.main{grid-column:2}
@media(max-width:1332px){.app{margin:0 16px}}
@media(max-width:700px){body:before{width:100%;border-radius:0}.app{margin:0;border-radius:0}.main{grid-column:auto}}
/* Карточки категорий: общий ритм и отдельные строки подкатегорий. */
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
.category{border-radius:30px;overflow:hidden}
.category-head,.sub-row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:14px}
.category-head{padding:22px;min-height:92px}
.name{min-width:0;overflow-wrap:anywhere;line-height:1.4}
.actions{margin:0;gap:6px}
.action{width:36px;height:36px;flex:none}
.sub-list{border-top:1px solid #e8eae5}
.sub-row{grid-template-columns:38px minmax(0,1fr) auto;padding:13px 22px 13px 30px;min-height:65px}
.sub-row .name{font-size:14px}.sub-row .action{width:32px;height:32px}
.recurring{width:18px;height:18px;font-size:14px}
@media(max-width:850px){.grid{grid-template-columns:1fr}}
@media(max-width:700px){.category{border-radius:27px}.category-head{padding:18px}.sub-row{padding-left:24px;padding-right:18px}}
.grid{display:block;column-count:2;column-gap:20px}.category{display:inline-block;width:100%;vertical-align:top;break-inside:avoid;margin:0 0 20px}.menu-button,.sub-row .menu-button{width:36px;height:36px;font-size:20px;letter-spacing:1px;background:transparent}.menu-button:hover{background:#eeefeb}.sub-row{grid-template-columns:48px minmax(0,1fr) auto;padding-left:22px}.sub-row .icon{width:38px;height:38px;justify-self:center;font-size:18px}.sub-row .name{font-size:14px;transform:none}@media(max-width:850px){.grid{column-count:1}}@media(max-width:700px){.sub-row{padding-left:18px}.category{margin-bottom:14px}}
/* Общие размеры и ритм со страницей статистики. */
.header h1{font-size:30px;font-weight:800;-webkit-text-stroke:.8px currentColor}
.sidebar .nav a{font-size:14px}.sidebar .brand,.sidebar .nav{flex-shrink:0}.sidebar .brand{line-height:1.3}
.main{padding-bottom:0}.section{margin-bottom:38px}.section-heading{margin-bottom:20px}
.grid{column-gap:12px}.category{border-radius:30px;margin-bottom:12px}
.category-head{grid-template-columns:42px minmax(0,1fr) auto;gap:12px;padding:24px;min-height:90px}
.category-head .icon{width:42px;height:42px;border-radius:50%;font-size:22px}
.category-head .name{font-size:18px;font-weight:800;letter-spacing:.01em;line-height:1.35}
.sub-row{grid-template-columns:42px minmax(0,1fr) auto;gap:12px;padding:14px 24px;min-height:66px}
.sub-row .icon{width:34px;height:34px;border-radius:50%;font-size:17px;justify-self:center}
.sub-row .name{font-size:14px;font-weight:700}.menu-button,.sub-row .menu-button{width:36px;height:36px}
@media(max-width:1332px){body:before{width:min(1300px,100%)}.app{margin:0 auto}.sidebar{left:max(16px,calc((100vw - 1300px)/2 + 16px))}}
@media(max-width:700px){.header h1{font-size:26px}.category-head{padding:20px}.sub-row{padding:14px 20px}.category{margin-bottom:12px}}
.section-heading{align-items:center;gap:26px}.section-count{margin-left:0;line-height:1}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}.category-column{display:grid;gap:12px;min-width:0}.category{display:block;margin:0}.section{margin-bottom:38px}.section:last-child{margin-bottom:0}@media(max-width:850px){.grid{grid-template-columns:1fr}.category-column:empty{display:none}}
.header{margin-bottom:28px}
.brand{padding:0 10px 35px;line-height:normal}.brand-logo{display:block;position:relative;width:150px;height:53px;overflow:hidden;flex:none;mix-blend-mode:multiply}.brand-logo img{position:absolute;display:block;max-width:none;width:283.33px;height:auto;left:-66.67px;top:-20.83px}
</style>
</head>
<body><div class="app">
<aside class="sidebar"><div class="brand"><span class="brand-logo"><img src="logo.png" alt="Могну Финансы"></span></div><nav class="nav" aria-label="Основная навигация"><a href="dashboard.html"><span class="ico">⌂</span> Обзор</a><a href="transactions.html"><span class="ico">⇄</span> Транзакции</a><a href="statistics.html"><span class="ico">▥</span> Статистика</a><a href="categories.html" class="active" aria-current="page"><span class="ico">▦</span> Категории</a></nav><div class="sidebar-bottom"><div class="profile"><div class="avatar">АЛ</div><div><strong>Алексей</strong></div><button class="dots" aria-label="Меню пользователя">···</button></div></div></aside>
<main class="main"><nav class="mobile-nav" aria-label="Основная навигация"><a href="dashboard.html">Обзор</a><a href="transactions.html">Транзакции</a><a href="statistics.html">Статистика</a><a href="categories.html" class="active" aria-current="page">Категории</a></nav><header class="header"><h1>Категории</h1><button class="primary" id="add"><b>+</b> Добавить категорию</button></header><section class="section"><div class="section-heading"><h2>Расходы</h2><span class="section-count" id="expense-count"></span></div><div class="grid" id="expense"></div></section><section class="section"><div class="section-heading"><h2>Доходы</h2><span class="section-count" id="income-count"></span></div><div class="grid" id="income"></div></section></main></div>
<dialog id="confirmation"><div class="dialog-inner"><div class="dialog-header"><h2>Удалить категорию?</h2><button class="close" type="button" data-close="confirmation" aria-label="Закрыть">×</button></div><p class="confirm-text" id="confirm-text"></p><div class="confirm-actions"><button class="secondary" type="button" data-close="confirmation">Отмена</button><button class="primary danger" id="confirm-delete">Удалить</button></div></div></dialog>
<script>
const initial=[
{id:1,name:'Продукты',type:'expense',emoji:'🥑',color:'#dce9c8',regular:true,used:true},
{id:2,name:'Покупки на неделю',type:'expense',parent:1,emoji:'🛒',color:'#e7eddb',regular:true,used:false},
{id:3,name:'Кофе и кафе',type:'expense',emoji:'☕',color:'#f1dfce',regular:false,used:true},
{id:4,name:'Кафе',type:'expense',parent:3,emoji:'🍽️',color:'#f5e9dc',regular:false,used:false},
{id:5,name:'Транспорт',type:'expense',emoji:'🚕',color:'#f1e8c6',regular:false,used:true},
{id:6,name:'Дом',type:'expense',emoji:'🏠',color:'#dce5f0',regular:true,used:true},
{id:7,name:'Интернет и связь',type:'expense',parent:6,emoji:'📱',color:'#e1e8f2',regular:true,used:false},
{id:8,name:'Здоровье',type:'expense',emoji:'✳️',color:'#f0dfda',regular:false,used:true},
{id:9,name:'Подписки',type:'expense',emoji:'🎧',color:'#e8ddf1',regular:true,used:true},
{id:10,name:'Зарплата',type:'income',emoji:'💼',color:'#dbead8',regular:true,used:true},
{id:11,name:'Основная работа',type:'income',parent:10,emoji:'💻',color:'#e6f0df',regular:true,used:false},
{id:12,name:'Другие доходы',type:'income',emoji:'✨',color:'#eee6cf',regular:false,used:false}
];
let categories=initial.map(c=>({...c})), deleting=null;
const $=s=>document.querySelector(s);const escapeHtml=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const recurrence=c=>c.regular?'<span class="recurring" title="Регулярная категория" aria-label="Регулярная категория">↻</span>':'';
function row(c,sub=false){return `<div class="${sub?'sub-row':'category-head'}"><span class="icon" style="background:${c.color}" aria-hidden="true">${c.emoji}</span><span class="name">${escapeHtml(c.name)}${recurrence(c)}</span><div class="actions"><button class="action menu-button" type="button" aria-label="Действия: ${escapeHtml(c.name)}" title="Действия">···</button></div></div>`}
function render(){for(const type of ['expense','income']){const roots=categories.filter(c=>c.type===type&&!c.parent);$('#'+type+'-count').textContent=roots.length;const cards=roots.map(c=>{const children=categories.filter(x=>x.parent===c.id);return `<article class="category">${row(c)}${children.length?`<div class="sub-list">${children.map(x=>row(x,true)).join('')}</div>`:''}</article>`});$('#'+type).innerHTML=cards.length?[0,1].map(col=>`<div class="category-column">${cards.filter((_,i)=>i%2===col).join('')}</div>`).join(''):'<div class="empty">Категорий пока нет</div>'}}
document.addEventListener('click',e=>{const del=e.target.closest('[data-delete]'),close=e.target.closest('[data-close]');if(close)$('#'+close.dataset.close).close();if(del){deleting=Number(del.dataset.delete);const c=categories.find(x=>x.id===deleting),hasChildren=categories.some(x=>x.parent===deleting);$('#confirm-text').textContent=hasChildren?'Сначала удалите подкатегории этой категории.':c.used?'Эта категория используется в транзакциях, поэтому удалить её нельзя.':`Категория «${c.name}» будет удалена.`;$('#confirm-delete').hidden=hasChildren||c.used;$('#confirmation').showModal()}});
$('#confirm-delete').onclick=()=>{categories=categories.filter(c=>c.id!==deleting);$('#confirmation').close();render()};
render();
</script></body></html>
